name: Validate and merge workshop pull requests
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const fail = async message => {
              core.setFailed(message);
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body: `🍉 Workshop bot: ${message}`});
            };
            if (!pr.title.includes('🍉')) return fail('Please add 🍉 to the pull request title, then edit it to rerun this check.');
            const {data: files} = await github.rest.pulls.listFiles({owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number});
            const names = files.map(f => f.filename);
            if (names.length === 1 && names[0] === 'WALL.md') {
              const file = files[0];
              if (file.status === 'modified') return core.notice('Wall signature accepted; merge after resolving any conflict.');
              return fail('WALL.md must be modified, not added or deleted.');
            }
            const expected = `cells/${pr.user.login}.json`;
            if (names.length !== 1 || names[0] !== expected) return fail(`Change exactly one file: \`${expected}\`.`);
            const {data} = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path: expected, ref: pr.head.sha});
            let cell; try { cell = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8')); } catch { return fail('Your cell file must contain valid JSON.'); }
            if (cell.username !== pr.user.login || !['acid','lime','purple','pink','teal','indigo'].includes(cell.color)) return fail('Use your exact GitHub username and one of: acid, lime, purple, pink, teal, indigo.');
            await github.rest.pulls.createReview({owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, event: 'APPROVE', body: '🍉 Valid cell — merging your pixel.'});
            await github.rest.pulls.merge({owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, merge_method: 'squash'});
